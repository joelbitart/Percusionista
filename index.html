}

// ---------- Audio ----------
let AC = null;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function noiseBurst(dur, freq, vol){
  try{
    const a = ac(), len = a.sampleRate*dur, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq;
    const g=a.createGain(); g.gain.value=vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }catch(e){}
}
function beep(freq,dur,vol,type){
  try{
    const a=ac(), o=a.createOscillator(), g=a.createGain();
    o.type=type||'square'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
function sfxJump(){ beep(300,.12,.12,'square'); beep(450,.1,.1,'square'); }
function sfxStomp(){ noiseBurst(.18, 900, .5); beep(150,.15,.2,'sine'); }
function sfxHurt(){ noiseBurst(.3, 500, .5); beep(110,.3,.25,'sawtooth'); }
function sfxCoin(){ beep(760,.08,.15); setTimeout(()=>beep(1010,.13,.15),70); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.25,.2),i*180)); }

// ---------- LEVELS (¡solo datos!) ----------
// tiles: G suelo, B ladrillo, P plataforma, S cajón de madera, D bloque de tambor
function buildMap(spec){
  const m=[]; const MW=220, MH=18;
  for(let x=0;x<MW;x++){ m[x]=[]; for(let y=0;y<MH;y++) m[x][y]=' '; }
  const rect=(x0,y0,x1,y1,t)=>{ for(let x=x0;x<x1;x++) for(let y=y0;y<y1;y++) if(m[x]) m[x][y]=t; };
  // suelo (con huecos opcionales)
  if(!spec.pits) rect(0,15,MW,18,'G');
  else { let x=0; for(const [gap0,gap1] of spec.pits.concat([[999,999]])){ rect(x,15,Math.min(gap0,MW),18,'G'); x=gap1; } }
  for(const r of spec.rects) rect(r[0],r[1],r[2],r[3],r[4]);
  for(const [x,y] of spec.drums) m[x][y]='D';
  m.copRows = spec.copRows||[];
  return m;
}

    })},
];
LEVELS.forEach(L=>{
  L.cops = L.map.copRows.map(r=>({x:r[0],dir:1,min:r[1],max:r[2]}));

  }
  L.GOAL_X = 208*20;
});

// ---------- Drum sticks & player ----------
const sticks=[], darts=[], bossShots=[], batons=[];
const P = { x:40, y:200, vx:0, vy:0, w:14, h:22, onG:false, face:1, lives:3, inv:0, anim:0, drumming:0, drumLv:0, stickCount:0, throwCd:0 };
let map=[], coins=[], cops=[];
let boss=null, bossDied=false;
let LV=0; // índice de nivel actual
let unlocked = 1;
try{ unlocked = Math.max(1, parseInt(window.localStorage.getItem('perc_unlock')||'1')); }catch(e){}

// ---------- State ----------
let state='select'; // select | play | dead | win | finale
let score=0, camX=0, t=0, flash=0, msg='', msgT=0, sel=0;
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
  if(state==='select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA'){ sel=(sel+LEVELS.length-1)%LEVELS.length; sfxJump(); }
    if(e.code==='ArrowRight'||e.code==='KeyD'){ sel=(sel+1)%LEVELS.length; sfxJump(); }
    if((e.code==='Space'||e.code==='Enter') && sel<unlocked){ startLevel(sel); }
  }
  else if((state==='dead') && (e.code==='Space'||e.code==='Enter')) state='select';
  else if(state==='win' && (e.code==='Space'||e.code==='Enter')){
    if(LV+1<LEVELS.length){ unlocked=Math.max(unlocked,LV+2); try{window.localStorage.setItem('perc_unlock',unlocked);}catch(e){} state='select'; sel=LV+1; }
    else { unlocked=LEVELS.length; try{window.localStorage.setItem('perc_unlock',unlocked);}catch(e){} state='select'; }
  }
  if(state==='play' && e.code==='KeyX') throwStick();
  if(state==='play' && (e.code==='KeyC'||e.code==='KeyZ')) playDrum();
});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('pointerdown',()=>{ if(state==='select'&&sel<unlocked) startLevel(sel); if(state==='dead'||state==='win') state='select'; });

function startLevel(i){
  LV=i; const L=LEVELS[i];
  map=L.map; coins=L.coins; cops=L.cops;
  ac(); startMusic(L.rhythm);
  P.x=40; P.y=180; P.vx=0; P.vy=0; P.lives=3; P.inv=60;
  P.drumLv=0; P.stickCount=0; P.throwCd=0;
  score=0; camX=0; groove=0;
  boss=null; bossDied=false;
  darts.length=0; sticks.length=0; bossShots.length=0; batons.length=0;
  coins.forEach(c=>c.got=false);
  for(let x=0;x<220;x++) for(let y=0;y<18;y++) if(map[x][y]==='U') map[x][y]='D';
  cops.forEach(c=>{ c.px=c.x*20; c.py=13.4*20; c.w=18;c.h=26; c.alive=true; c.stunned=0; c.dir=Math.random()<.5?1:-1; c.vy=0; });
  state='play';
}

function throwStick(){
  if(P.drumLv<2 || P.stickCount<=0 || P.throwCd>0) return;
  P.stickCount--; P.throwCd=18; P.drumming=10;
  darts.push({x:P.x+P.w/2+(P.face>0?8:-12), y:P.y+6, vx:P.face*7, vy:-3});
  noiseBurst(.1,1400,.4);
}
let groove=0, grooveBest=0;
function playDrum(){
  P.drumming=14;
  const R=RHYTHMS[LEVELS[LV].rhythm], hit=mStep%R.steps;
  const onBeat=R.onBeat.includes(hit);
  if(P.drumLv===2){ noiseBurst(.22,220,.55); beep(90,.18,.3,'sine'); }
  else if(P.drumLv===1){ noiseBurst(.14,420,.4); beep(140,.1,.15,'sine'); }
  else { noiseBurst(.09,800,.35); }
  if(onBeat){
    groove++; if(groove>grooveBest) grooveBest=groove;
    score+=50; msg='¡EN RITMO! ×'+groove; msgT=50;
    beep(groove>=5?1568:1046,.08,.15,'square');
    if(boss && boss.type==='noise' && boss.st!=='stun') boss.noise=Math.max(0,boss.noise-8); // buen ritmo lo calma
  } else {
    groove=0; score+=10; noiseBurst(.05,300,.15);
    if(boss && boss.type==='noise' && boss.st==='idle') boss.noise=Math.min(110,boss.noise+14); // ¡rumor de queja!
  }
}

// ---------- Music engine (per-rhythm) ----------
let musicOn = true, musicTimer = null, mStep = 0, mBar = 0, curRhythm = 'festejo';
// melodía con secuencia: notas tipo 'E5:2', pausas '.' — se repite sin fin
const NOTE_F={C:261.63,D:293.66,E:329.63,F:349.23,G:392.00,A:440.00,B:493.88};
function noteHz(n){ const m=n.match(/^([A-G])(#?)(\d)$/); if(!m) return 440; return NOTE_F[m[1]]*Math.pow(2,(m[2]?1:0))*Math.pow(2,m[3]-4); }
let melSeq=[], melIdx=0, melLeft=0;
function setMelody(txt){
  melSeq=[]; melIdx=0; melLeft=0;
  (txt||'').trim().split(/\s+/).forEach(tok=>{
    const p=tok.split(':'); const len=Math.max(1, Math.round(parseFloat(p[1]||'1')));
    if(p[0]==='.'||p[0]==='0'||p[0]==='R') melSeq.push({rest:true,len});
    else melSeq.push({f:noteHz(p[0]),len});
  });
}
function melodyTick(){
  if(!melSeq.length) return;
  if(melLeft<=0){
    const e=melSeq[melIdx]; melIdx=(melIdx+1)%melSeq.length;
    if(!e.rest) beep(e.f, RHYTHMS[curRhythm].tempo*e.len/1000*0.95, .12, 'triangle');
    melLeft=e.len;
  }
  melLeft--;
}
function musicTick(){
  if(!musicOn) return;
  melodyTick();
  RHYTHMS[curRhythm].play(mStep);
  mStep++;
  if(mStep % RHYTHMS[curRhythm].steps === 0) mBar++;
}
function startMusic(r){ curRhythm=r||curRhythm; setMelody(RHYTHMS[curRhythm].mel); if(musicTimer){ clearInterval(musicTimer); } musicTimer=setInterval(musicTick, RHYTHMS[curRhythm].tempo); }
function stopMusic(){ clearInterval(musicTimer); musicTimer=null; }

function solid(tx,ty){
  if(tx<0||tx>=220) return true;
  if(ty>=18||ty<0) return false;
  const c=map[tx][ty];
  return c==='G'||c==='B'||c==='P'||c==='S'||c==='D'||c==='U';
}
const bumps=[];
function bumpDrumBlocks(rising){
  if(!rising) return;
  const ty=Math.floor(P.y/20)-1;
  if(ty<0||ty>=18) return;
  const hits=[];
  for(const tx of [Math.floor((P.x+3)/20), Math.floor((P.x+P.w-3)/20)]){
    if(tx>=0&&tx<220&&map[tx][ty]==='D') hits.push([tx,ty]);
  }
  for(const [tx,ty2] of hits){
    map[tx][ty2]='U';
    bumps.push({tx,ty:ty2,timer:12});
    sticks.push({x:tx*20+4, y:(ty2-1)*20+2, vy:-5, vx:(tx%2?2.4:-2.4), settled:false});
    score+=20; sfxStomp(); P.drumming=14;
  }
}

function update(){
  t++;
  if(state!=='play'){ return; }
  let ax=0;
  if(keys.ArrowLeft||keys.KeyA) ax=-1;
  if(keys.ArrowRight||keys.KeyD) ax=1;
  P.vx = ax*MOVE;
  if(ax) P.face=ax;
  if((keys.ArrowUp||keys.Space||keys.KeyW) && P.onG){ P.vy=-JUMPS[P.drumLv]; P.onG=false; sfxJump(); P.drumming=14; }
  P.vy += GRAV; if(P.vy>12) P.vy=12;
  P.x += P.vx;
  if(P.x<0) P.x=0;
  if(P.vx>0){
    if(solid(Math.floor((P.x+P.w)/20), Math.floor((P.y+4)/20)) || solid(Math.floor((P.x+P.w)/20), Math.floor((P.y+P.h-4)/20))){
      P.x = Math.floor((P.x+P.w)/20)*20 - P.w - 0.1; P.vx=0;
    }
  } else if(P.vx<0){
    if(solid(Math.floor(P.x/20), Math.floor((P.y+4)/20)) || solid(Math.floor(P.x/20), Math.floor((P.y+P.h-4)/20))){
      P.x = (Math.floor(P.x/20)+1)*20 + 0.1; P.vx=0;
    }
  }
  const rising = P.vy < 0;
  P.y += P.vy; P.onG=false;
  if(P.vy>=0){
    if(solid(Math.floor((P.x+3)/20), Math.floor((P.y+P.h)/20)) || solid(Math.floor((P.x+P.w-3)/20), Math.floor((P.y+P.h)/20))){
      P.y = Math.floor((P.y+P.h)/20)*20 - P.h; P.vy=0; P.onG=true;
    }
  } else {
    if(solid(Math.floor((P.x+3)/20), Math.floor(P.y/20)) || solid(Math.floor((P.x+P.w-3)/20), Math.floor(P.y/20))){
      P.y = (Math.floor(P.y/20)+1)*20 + 0.1; P.vy=0;
      bumpDrumBlocks(rising);
    }
  }
  if(P.y>H+60) hurt(true);
  for(const c of coins){
    c.bob+=0.1;
    if(!c.got && Math.abs(c.x+7-(P.x+P.w/2))<14 && Math.abs(c.y+8-(P.y+P.h/2))<18){ c.got=true; score+=10; sfxCoin();
      const Rn=RHYTHMS[curRhythm]; if(boss&&boss.type==='noise'&&boss.st==='idle'&&!Rn.onBeat.includes(mStep%Rn.steps)){ boss.noise=Math.min(110,boss.noise+12); msg='¡MUY RUIDOSO!'; msgT=40; } }
  }
  for(let i=bumps.length-1;i>=0;i--){ if(--bumps[i].timer<=0) bumps.splice(i,1); }
  for(let i=sticks.length-1;i>=0;i--){
    const s=sticks[i];
    if(!s.settled){
      s.x += s.vx||0; s.y+=s.vy; s.vy+=0.3;
      const tx=Math.floor((s.x+5)/20), ty=Math.floor((s.y+14)/20);
      if(ty<18 && solid(tx,ty)){ s.y=ty*20-14; s.vy=0; s.settled=true; }
    }
    if(Math.abs(s.x+5-(P.x+P.w/2))<14 && Math.abs(s.y+7-(P.y+P.h/2))<18){
      sticks.splice(i,1); P.stickCount++; sfxCoin(); beep(660,.15,.15);
      if((P.drumLv===0&&P.stickCount>=2)||(P.drumLv===1&&P.stickCount>=5)){
        P.drumLv++; sfxWin(); msg='¡MEJORASTE EL TAMBOR: '+DRUM_NAMES[P.drumLv]+'!'; msgT=120;
      }
      score+=30;
    }
  }
  if(msgT>0) msgT--;
  for(let i=darts.length-1;i>=0;i--){
    const d=darts[i];
    d.x+=d.vx; d.y+=d.vy; d.vy+=0.25;
    let gone = d.x<camX-40 || d.x>camX+W+40 || d.y>H+40;
    if(!gone && solid(Math.floor((d.x+2)/20), Math.floor(d.y/20))){ gone=true; noiseBurst(.06,900,.2); }
    if(!gone) for(const c of cops){
      if(c.alive && Math.abs(c.px-d.x)<16 && Math.abs(c.py+13-d.y)<26){
        c.alive=false; c.vy=-5; gone=true; score+=80; sfxStomp(); P.drumming=10; break;
      }
    }
    if(gone) darts.splice(i,1);
  }
  if(P.throwCd>0) P.throwCd--;
  const spd = LEVELS[LV].copSpeed;
  for(const c of cops){
    if(!c.alive){ c.vy += GRAV; c.py += c.vy; continue; }
    if(c.stunned>0){ c.stunned--; continue; }
    c.px += c.dir*spd;
    if(c.px/20 < c.min || c.px/20 > c.max) c.dir*=-1;
    if(Math.abs(c.px-(P.x+P.w/2))<16 && Math.abs(c.py-(P.y+P.h/2))<22){
      if(P.vy>1 && P.y < c.py-6){ c.stunned=90; c.alive=false; c.vy=-6; P.vy=-8; score+=50; sfxStomp(); }
      else if(P.inv<=0) hurt();
    }
  }
  // ---- JEFE: El Sargento ----
  const BL=LEVELS[LV];
  if(!boss && BL.boss && !bossDied && P.x>BL.boss.trigger){
    boss={name:BL.boss.name, hp:BL.boss.hp, maxHp:BL.boss.hp, type:BL.boss.type||'dash', x:Math.min(BL.boss.trigger+520, BL.GOAL_X-160), y:15*20-62, w:44, h:62, vx:0, vy:0, st:'idle', t:0, dir:-1, flash:0, beeped:0, noise:0, waveN:0};
    msg='¡'+boss.name+'!'; msgT=90; sfxHurt();
  }
  if(boss){
    boss.flash=Math.max(0,boss.flash-1);
    boss.t++;
    const bDist=P.x-boss.x;
    if(boss.type==='waves'){
      // LA CAPITANA: se planta, silba y lanza ondas; a veces suelta bastones
      boss.vx=0; boss.dir=bDist>0?1:-1;
      if(boss.st==='idle'){
        if(boss.t===40||boss.t===70){ beep(1400,.08,.25,'square'); }
        if(boss.t===50 || boss.t===80 || boss.t===110){
          bossShots.push({x:boss.x-20, y:14*20-14, vx:-(3.2+boss.waveN*0.5)}); beep(1800,.12,.2,'square'); boss.waveN++;
        }
        if(boss.t===150 && boss.waveN>=2){ batons.push({x:P.x+80+Math.random()*60, y:-20, vy:1, rot:0}); }
        if(boss.t>=170){ boss.st='tired'; boss.t=0; boss.waveN=0; }
      } else if(boss.st==='tired'){
        if(boss.t>=80){ boss.st='idle'; boss.t=0; }
      } else if(boss.st==='stun'){
        if(boss.t>=70){ boss.st='idle'; boss.t=0; }
      }
      // ondas: solo dañan a la altura del pecho; saltar las esquiva
      for(let i=bossShots.length-1;i>=0;i--){
        const s=bossShots[i]; s.x+=s.vx;
        if(s.x<camX-40) bossShots.splice(i,1);
        else if(Math.abs(s.x-(P.x+P.w/2))<14 && Math.abs(s.y-(P.y+P.h/2))<16 && P.inv<=0){ hurt(); bossShots.splice(i,1); }
      }
      for(let i=batons.length-1;i>=0;i--){
        const bt=batons[i]; bt.vy+=0.28; bt.y+=bt.vy; bt.rot+=0.3;
        const tx=Math.floor((bt.x+3)/20), ty=Math.floor((bt.y+8)/20);
        let gone=bt.y>H+30 || (ty<18 && solid(tx,ty));
        if(gone){ batons.splice(i,1); noiseBurst(.06,900,.2); }
        else if(Math.abs(bt.x-(P.x+P.w/2))<14 && Math.abs(bt.y+6-(P.y+P.h/2))<18 && P.inv<=0){ hurt(); batons.splice(i,1); }
      }
      boss.x=Math.max(BL.boss.trigger-40, Math.min(boss.x, BL.GOAL_X-120));
    }
    else if(boss.type==='noise'){
      // EL COMANDANTE: medidor de ruido — tambeat fuera de ritmo lo llena; a 100 ataca con onda de silbato
      boss.vx=0; boss.dir=bDist>0?1:-1;
      if(boss.st==='idle'){
        if(boss.t>50 && boss.t%40===0){ beep(1600,.06,.2,'square'); } // silba molesto
        if(boss.noise>=100){ boss.st='attack'; boss.t=0; noiseBurst(.4,300,.5); boss.vx=0; }
      } else if(boss.st==='attack'){
        if(boss.t===1) bossShots.push({x:boss.x-24, y:14*20-10, vx:-5});
        if(boss.t===30) bossShots.push({x:boss.x-24, y:13*20-6, vx:-4.5});
        if(boss.t>=90){ boss.st='tired'; boss.t=0; boss.noise=0; }
      } else if(boss.st==='tired'){
        if(boss.t>=70){ boss.st='idle'; boss.t=0; }
      } else if(boss.st==='stun'){
        if(boss.t>=70){ boss.st='idle'; boss.t=0; }
      }
      for(let i=bossShots.length-1;i>=0;i--){
        const s=bossShots[i]; s.x+=s.vx;
        if(s.x<camX-40) bossShots.splice(i,1);
        else if(Math.abs(s.x-(P.x+P.w/2))<14 && Math.abs(s.y-(P.y+P.h/2))<16 && P.inv<=0){ hurt(); bossShots.splice(i,1); }
      }
      boss.x=Math.max(BL.boss.trigger-40, Math.min(boss.x, BL.GOAL_X-120));
    }
    else { // type 'dash' — El Sargento
      if(boss.st==='idle'){
        boss.vx=0; boss.dir=bDist>0?1:-1;
        if(boss.t===60||boss.t===100){ beep(1400,.08,.25,'square'); boss.beeped++; } // silbato: ¡aviso!
        if(boss.t>=150){ boss.st='dash'; boss.t=0; boss.vx=boss.dir*6.5; noiseBurst(.3,600,.4); }
      } else if(boss.st==='dash'){
        boss.x+=boss.vx;
        if(boss.t>75){ boss.st='tired'; boss.t=0; }
      } else if(boss.st==='tired'){
        boss.vx=0;
        if(boss.t>=50){ boss.st='idle'; boss.t=0; boss.beeped=0; }
      } else if(boss.st==='stun'){
        boss.vx=0;
        if(boss.t>=70){ boss.st='idle'; boss.t=0; }
      }
    }
    boss.x=Math.max(BL.boss.trigger-100, Math.min(boss.x, BL.GOAL_X-60));
    const bx=boss.x-boss.w/2, by=boss.y;
    const nearX=Math.abs(boss.x-(P.x+P.w/2))<34;
    const stompHit = nearX && P.vy>1 && P.y+P.h < by+30; // caes sobre la cabeza
    const touchHit = nearX && Math.abs(by+31-(P.y+P.h/2))<48;
    if(stompHit && boss.st!=='stun'){
        boss.hp--; boss.flash=14; P.vy=-9; boss.st='stun'; boss.t=0; score+=100; sfxStomp(); noiseBurst(.25,500,.5);
        if(boss.type==='noise'){ const Rn=RHYTHMS[curRhythm]; if(!Rn.onBeat.includes(mStep%Rn.steps)) boss.noise=Math.min(110,boss.noise+10); else boss.noise=Math.max(0,boss.noise-8); }
        msg=boss.hp>0 ? '¡PISADO! QUEDAN '+boss.hp : ''; msgT=60;
        if(boss.hp<=0){
          bossDied=true; boss=null; score+=1000; sfxWin();
          msg='¡'+BL.boss.name+' DERROTADO!'; msgT=150; flash=20;
        }
    } else if(touchHit && P.inv<=0 && boss.st!=='stun') hurt();
  }
  if(P.inv>0) P.inv--;
  if(P.drumming>0) P.drumming--;
  if(flash>0) flash--;
  camX = Math.max(0, Math.min(P.x - W/2 + 40, 220*20 - W));
  if(boss && P.x > BL.GOAL_X-90) P.x=BL.GOAL_X-90; // pared del estadio
  if(P.x > LEVELS[LV].GOAL_X || (LEVELS[LV].boss && bossDied)){
    if(LV+1<LEVELS.length){ unlocked=Math.max(unlocked,LV+2); try{window.localStorage.setItem('perc_unlock',unlocked);}catch(e){} state='win'; }
    else { unlocked=LEVELS.length; try{window.localStorage.setItem('perc_unlock',unlocked);}catch(e){} state='finale'; }
    sfxWin(); stopMusic();
  }
}
function hurt(pit){
  if(P.inv>0 && !pit) return;
  if(!pit && P.drumLv>=2){ P.drumLv=1; P.inv=90; flash=10; sfxStomp(); msg='¡TU BOMBO SE ROMPIÓ!'; msgT=100; return; }
  P.lives--; P.inv=90; flash=15; sfxHurt();
  if(P.lives<=0){ state='dead'; stopMusic(); }
  else if(!pit){ P.y-=10; P.vy=-7; }
  else { P.x=Math.max(40,P.x-80); P.y=100; P.vy=0; }
}

// ---------- Dibujo ----------
function px(x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(Math.round(x),Math.round(y),w,h); }
function theme(){ return THEMES[LEVELS[LV].theme]; }
let bgLv=0;
function drawBg(){
  const th=THEMES[LEVELS[Math.min(LV,LEVELS.length-1)].theme];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,th.sky[0]); g.addColorStop(.55,th.sky[1]); g.addColorStop(1,th.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  px(W-120-camX*0.05%60, 40, 34, 34, th.sun);
  ctx.fillStyle=th.mtn1;
  for(let i=0;i<8;i++){
    const mx=((i*160 - camX*0.25)%(W+320)+W+320)%(W+320)-160;
    ctx.beginPath(); ctx.moveTo(mx-80,240); ctx.lineTo(mx,110); ctx.lineTo(mx+80,240); ctx.fill();
  }
  ctx.fillStyle=th.mtn2;
  for(let i=0;i<8;i++){
    const mx=((i*140+70 - camX*0.45)%(W+280)+W+280)%(W+280)-140;
    ctx.beginPath(); ctx.moveTo(mx-70,250); ctx.lineTo(mx,150); ctx.lineTo(mx+70,250); ctx.fill();
  }
  for(let i=0;i<40;i++){
    const bx=(i*90 - camX*0.7); if(bx<-120||bx>W+20) continue;
    const bh=70+((i*37)%60), colr=th.bldgs[i%5];
    px(bx, 240-bh, 70, bh, colr);
    px(bx, 240-bh, 70, 8, th.roof);
    for(let wy=0; wy<bh-20; wy+=18) for(let wx=0; wx<60; wx+=22)
      px(bx+8+wx, 252-bh+wy, 12, 10, '#2c2c3a');
    px(bx+26,240-bh+20,14,16,'#3a2c20');
  }
}
function drawTiles(){
  const th=theme();
  const x0=Math.floor(camX/20), x1=x0+Math.ceil(W/20)+1;
  for(let x=x0;x<x1;x++) for(let y=0;y<18;y++){
    if(x<0||x>=220) continue;
    const c=map[x][y]; if(c===' ') continue;
    const bump=bumps.find(b=>b.tx===x&&b.ty===y);
    const off = bump ? -Math.sin((12-bump.timer)/12*Math.PI)*8 : 0;
    const sx=x*20-camX, sy=y*20+off;
    if(c==='G'){ px(sx,sy,20,20,th.ground[0]); px(sx,sy,20,4,th.ground[1]); px(sx,sy+17,20,3,th.ground[2]);
      if((x+y)%2===0) px(sx+4,sy+8,3,3,th.ground[2]); }
    else if(c==='D'){ px(sx,sy,20,20,'#7a4a22'); px(sx,sy,20,3,'#a8733a'); px(sx,sy+18,20,2,'#4a2c10');
      px(sx+4,sy+4,12,12,'#e8d8b0'); px(sx+4,sy+4,12,2,'#c9b888');
      px(sx+7,sy+8,6,3,'#5a3a18'); px(sx+6,sy+7,8,1,'#5a3a18'); }
    else if(c==='U'){ px(sx,sy,20,20,'#5a3a1a'); px(sx,sy,20,3,'#6e4a26'); }
    else if(c==='B'){ px(sx,sy,20,20,th.brick[0]); px(sx,sy,20,3,th.brick[1]); px(sx+9,sy+3,2,17,th.brick[2]); }
    else if(c==='P'){ px(sx,sy,20,20,th.plat[0]); px(sx,sy,20,4,th.plat[1]); }
    else if(c==='S'){ px(sx,sy,20,20,th.crate[0]); px(sx+2,sy+2,16,16,th.crate[1]); px(sx,sy+8,20,3,th.crate[0]); }
  }
}
function drawCoins(){
  for(const c of coins){
    if(c.got) continue;
    const sx=c.x-camX, sy=c.y+Math.sin(c.bob)*2;

    // alfajor: dos galletas doradas con dulce de leche

    px(sx+6,sy+54+bob,10,8,'#1a2a4e'); px(sx+28,sy+54+bob,10,8,'#1a2a4e');
    if(b.st==='dash'){ px(sx+(b.dir>0?-6:42), sy+20, 4, 20, '#ffe980'); }
    if(b.st==='idle' && b.t>=60){ ctx.fillStyle='#ffe980'; ctx.font='bold 16px monospace'; ctx.fillText('¡PÍO PÍO!', sx-14, sy-24); }
  }
  if(b.st==='tired'){ ctx.fillStyle='#fff'; ctx.font='bold 11px monospace'; ctx.fillText('jaa… jaa…', sx-4, sy-20); }
  if(b.st==='stun'){ ctx.fillStyle='#aef'; ctx.font='bold 11px monospace'; ctx.fillText('¡AY!', sx+10, sy-22); }
  // barra de vida
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W/2-92, 40, 184, 16);
  ctx.fillStyle='#d94141'; ctx.fillRect(W/2-90, 42, Math.max(0,180*b.hp/b.maxHp), 12);
  const hint=b.type==='waves'?'ESQUIVA SUS ONDAS, PIÉSALO ×'+b.maxHp : b.type==='noise'?'TOCA EN RITMO O PIÉSALO ×'+b.maxHp : 'PIÉSALO ×'+b.maxHp;
  ctx.fillStyle='#ffe9b0'; ctx.font='bold 10px monospace'; ctx.fillText(b.name+' — '+hint, W/2-86, 51);
  // medidor de ruido (solo El Comandante)
  if(b.type==='noise'){
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(W/2-92, 58, 184, 10);
    ctx.fillStyle=b.noise>=80?'#ff6040':'#4ac0d9'; ctx.fillRect(W/2-90, 60, Math.min(180,b.noise*1.8), 6);
    ctx.fillStyle='#cfeaff'; ctx.font='bold 8px monospace'; ctx.fillText('QUEJA DE RUIDO', W/2-88, 66);
  }
}
function drawDart(d){
  const sx=d.x-camX, sy=d.y;
  if(sx<-20||sx>W+20) return;
  // ají volador
  px(sx,sy,8,4,'#e8b020'); px(sx+2,sy-1,5,2,'#ffc830'); px(sx+(P.face>0?8:-2),sy-2,2,3,'#3a7a2a');
}
function drawBossShots(){
  for(const s of bossShots){
    const sx=s.x-camX; if(sx<-30||sx>W+30) continue;
    // onda de silbato: anillos concéntricos
    const r=(t%12)/12*10;
    ctx.strokeStyle='#cfeaff'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(sx, s.y+7, 6+r, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#ffe980';
    ctx.beginPath(); ctx.arc(sx, s.y+7, 3, 0, Math.PI*2); ctx.stroke();
  }
  for(const bt of batons){
    const sx=bt.x-camX; if(sx<-30||sx>W+30) continue;
    ctx.save(); ctx.translate(sx+3, bt.y); ctx.rotate(bt.rot);
    px(-2,-10,4,20,'#8a5a2a'); px(-2,-10,4,4,'#d94141');
    ctx.restore();
  }
}
function drawOrchestra(){
  const bx=LEVELS[LV].GOAL_X-camX+60;
  if(bx<-200||bx>W+220) return;
  const gy=270, wave=Math.sin(t*0.12);
  px(bx,gy-6,16,6,'#8a5a2a'); px(bx,gy-16+wave,10,10,'#e8b088'); px(bx-2,gy-19+wave,14,3,'#1a1a1a');
  px(bx+8,gy-12,8,7,'#b04ad9');
  px(bx+34,gy-8,16,8,'#7a3a9e'); px(bx+40,gy-18+wave,10,10,'#e8b088'); px(bx+38,gy-21+wave,14,3,'#1a1a1a');
  px(bx+30,gy-14,26,4,'#c9914a'); px(bx+48,gy-16,8,8,'#e8c040');
  px(bx+70,gy-7,16,7,'#d94141'); px(bx+76,gy-17+wave,10,10,'#8a5a3a'); px(bx+74,gy-20+wave,14,3,'#1a1a1a');
  px(bx+64,gy-14,10,5,'#e8d8b0');
  px(bx-6,gy-58,110,14,theme().win);
  ctx.fillStyle='#fff'; ctx.font='bold 10px monospace'; ctx.fillText('FIESTA!', bx+18, gy-48);
}
function drawGoal(){
  const sx=LEVELS[LV].GOAL_X-camX;
  if(sx<-60||sx>W+60) return;
  px(sx-10,270,40,30,'#8a5a2a'); px(sx-10,270,40,6,'#a86a32');
  px(sx-4,276,28,18,'#c9914a');
  px(sx+30,190,3,110,'#6e4426');
  px(sx+33,190,34,22,theme().win); px(sx+33,196,34,4,'#ffffff');
  ctx.fillStyle='#fff'; ctx.font='10px monospace'; ctx.fillText('META', sx+38, 205);
}
function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,28);
  ctx.fillStyle='#ffe9b0'; ctx.font='bold 14px monospace';
  ctx.fillText('PUNTOS '+score, 12, 19);
  ctx.fillStyle='#8a9ec9'; ctx.font='bold 11px monospace';
  ctx.fillText(LEVELS[LV].name, 140, 19);
  if(groove>0){ ctx.fillStyle='#e8c040'; ctx.fillText('¡RITMO ×'+groove+'!', 12, 38); }
  for(let i=0;i<P.lives;i++){ px(W-30-i*20, 8, 12, 11, '#d94141'); px(W-27-i*20, 5, 6, 4, '#d94141'); }
  px(W-150,6,8,4,'#e8b020'); px(W-148,4,4,3,'#ffc830'); px(W-146,3,2,3,'#3a7a2a');
  ctx.fillStyle='#ffe9b0'; ctx.font='bold 14px monospace'; ctx.fillText('×'+P.stickCount, W-138, 18);
  ctx.fillStyle='#e8c040'; ctx.fillText(DRUM_NAMES[P.drumLv], W-100, 18);
  if(msgT>0) center(msg, 44, '#ffe980', 'bold 16px');
}
function center(text,y,col,size){
  ctx.fillStyle=col||'#fff'; ctx.font=(size||'bold 20px')+' monospace';
  ctx.textAlign='center'; ctx.fillText(text, W/2, y); ctx.textAlign='left';
}
function drawLevelCard(x,y,i,locked,active){
  const L=LEVELS[i], th=THEMES[L.theme];
  px(x,y,150,110, locked?'#2a2a34':'#3a3040');
  px(x,y,150,4,locked?'#444':th.sky[0]);
  if(!locked){
    // mini preview: sky + mountains + ground
    px(x+8,y+12,134,26,th.sky[1]); px(x+8,y+30,134,8,th.sky[2]);
    px(x+8,y+38,134,10,th.ground[0]);
    px(x+20,y+26,14,14,th.bldgs[0]); px(x+50,y+22,14,18,th.bldgs[1]); px(x+90,y+26,14,14,th.bldgs[2]);
  }
  ctx.fillStyle=locked?'#666':'#ffe9b0'; ctx.font='bold 12px monospace'; ctx.textAlign='center';
  ctx.fillText(locked?'???':L.name, x+75, y+66); ctx.textAlign='left';
  ctx.fillStyle=locked?'#555':'#e8b088'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText(locked?'BLOQUEADA':'RITMO: '+L.rhythm.toUpperCase(), x+75, y+84); ctx.textAlign='left';
  if(active){ px(x-3,y-3,156,3,'#e8c040'); px(x-3,y+110,156,3,'#e8c040'); px(x-3,y,3,110,'#e8c040'); px(x+150,y,3,110,'#e8c040'); }
}
function drawSelect(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1a0e28'); g.addColorStop(1,'#3a1a2e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  center('PERCUSIONISTA!', 60, '#e8c040', 'bold 30px');
  center('ELIGE TU CALLE', 88, '#fff', '16px');
  const startX = W/2 - (LEVELS.length*170-20)/2;
  for(let i=0;i<LEVELS.length;i++)
    drawLevelCard(startX+i*170, 110, i, i>=unlocked, i===sel);
  center('← → elegir    ESPACIO tocar', 260, '#fff', '14px');
  if(sel>=unlocked) center('¡Completa la calle anterior para desbloquear!', 284, '#d94141', '13px');
  else center('Calle: '+LEVELS[sel].name, 284, '#e8c040', 'bold 14px');
  center('Mejor racha de ritmo: ×'+grooveBest, 308, '#e8b088', '12px');
  center('C = tocar tambor · X = lanzar ají (con BOMBO)', 330, '#8a9ec9', '11px');
}
function draw(){
  if(state==='select'){ drawSelect(); return; }
  drawBg(); drawTiles(); drawCoins();
  for(const s of sticks) drawAji(s);
  for(const d of darts) drawDart(d);
  drawGoal(); drawOrchestra();
  if(boss) drawBoss(boss);
  drawBossShots();
  for(const c of cops) drawCop(c);
  if(state==='play'||state==='dead'||state==='win'||state==='finale') drawDrummer(P.x-camX, P.y, P.face, P.anim, P.onG, P.drumming);
  if(flash>0){ ctx.fillStyle='rgba(255,80,80,'+(flash/40)+')'; ctx.fillRect(0,0,W,H); }
  drawHUD();
  if(state==='dead'){
    ctx.fillStyle='rgba(10,5,20,0.72)'; ctx.fillRect(0,0,W,H);
    center('¿QUÉ MIRAS, CONCHA TU MARE!', 150, '#d94141', 'bold 26px');
    center('Puntos: '+score, 185, '#fff', '18px');
    center('APRIETA ESPACIO PARA VOLVER', 225, '#e8c040', 'bold 16px');
  }
  if(state==='win'){
    ctx.fillStyle='rgba(10,5,20,0.72)'; ctx.fillRect(0,0,W,H);
    center('¡CALLE COMPLETADA!', 140, '#e8c040', 'bold 26px');
    center('La orquesta de '+LEVELS[LV].name+' te aplaude.', 170, '#fff', '16px');
    center('Puntos: '+score, 192, '#fff', '18px');
    center('APRIETA ESPACIO — NUEVA CALLE DESBLOQUEADA: '+LEVELS[LV+1].name, 230, '#e8c040', 'bold 15px');
  }
  if(state==='finale'){
    ctx.fillStyle='rgba(10,5,20,0.72)'; ctx.fillRect(0,0,W,H);
    center('¡FIESTA TOTAL!', 130, '#e8c040', 'bold 30px');
    center('Tocaste en TODAS las calles del Perú.', 166, '#fff', '15px');
    center('festejo · huayño · landó — el ritmo no se detiene.', 186, '#e8b088', '14px');
    center('Puntos finales: '+score, 206, '#fff', '18px');
    center('APRIETA ESPACIO PARA VOLVER', 244, '#e8c040', 'bold 16px');
  }
}
function loop(){ update(); draw(); P.anim++; requestAnimationFrame(loop); }
loop();
</script>
